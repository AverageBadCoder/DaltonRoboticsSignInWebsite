server:
  port: 8080
  env: development
database:
  host: localhost
  port: 5432
  user: your_username
  password: your_password
  name: your_database_name
cors:
  allowed_origins:
    - http://localhost:3000
    - https://your-production-url.com
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
  allowed_headers:
    - Content-Type
    - Authorization
    - X-Requested-With